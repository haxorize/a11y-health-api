name: CI

# Pins and their reasons live here once. A YAML comment cannot be shared by an
# anchor, and `env` does not reach `services.*.image` — GitHub exposes `env` to
# `services.<id>.credentials` and `services.<id>.env.<id>` and nothing else — so
# the two values that read as mistakes without a reason point back here rather
# than carrying a copy. Issue #152 records why, and the sibling UI's workflow
# holds its own copies.
#
# postgres:15
#   The major local dev runs (Homebrew PostgreSQL 15.x) and the one the sibling
#   UI's e2e job runs, so the suite is measured against the server version it is
#   developed against. The bare major tracks the newest 15.x patch.
#   `docs/adr/0013-postgresql-only.md` owns the PostgreSQL dependency and
#   records no version, so this file and `CLAUDE.md` are where the major lives.
#
# prune-cache: true
#   setup-uv v9 turned this off deliberately, to ease load on PyPI; it is a
#   breaking change upstream because leaving it off grows the Actions cache. Set
#   back to true: the pruned cache is the cheaper one to keep, and stating it
#   means a later default flip is inert. See astral-sh/setup-uv#967.
#
# actions/checkout@v7 and astral-sh/setup-uv@v10.0.1 are the refs this workflow
# stands on, recorded so a report measured against it can tell whether it was
# measured against these. Neither is pinned to a revision: that was weighed
# against this repo's threat model and declined, and setup-uv publishes no
# floating major tag that could drift underneath.
#
# Deliberately absent, so a search for either stops here rather than reading the
# gap as an oversight: no `permissions:` block, because token scope comes from
# the repository setting and fork pull requests get a read-only token either
# way; and no Dependabot or Renovate config, because its main job would have
# been keeping revision pins fresh and those were declined above. Both were
# weighed against this repo's threat model and left out on purpose (#152).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  UV_PYTHON: "3.14"
  # Asserts uv.lock has not drifted from pyproject.toml on every uv call in
  # every job, so a bound edited without relocking fails the first one. The
  # Makefile exports the same variable and holds the reasoning.
  UV_LOCKED: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans the whole history
      # Ahead of the uv setup and the history scan: it reads only
      # .github/workflows/ and needs neither, so a broken workflow is reported
      # without paying for the rest of the job first.
      - name: Install actionlint
        run: |
          curl -sSL -o "$RUNNER_TEMP/actionlint.tgz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/actionlint-bin"
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP/actionlint-bin" actionlint
          echo "$RUNNER_TEMP/actionlint-bin" >> "$GITHUB_PATH"
      - name: Lint workflows
        # Semantic checks only, and it runs nowhere else: not in `make lint`,
        # not in the pre-commit hook. It cannot catch the class that costs the
        # most — a YAML load error, an unresolvable alias among them — because
        # GitHub never creates a run for a file it cannot load, so this step
        # does not execute for exactly the breakage that stops every job. On
        # trunk-only landing with main unprotected, that lands and the first
        # signal is the workflow-load failure on the push.
        run: actionlint
      - name: Install gitleaks
        run: |
          curl -sSL -o "$RUNNER_TEMP/gitleaks.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Scan history for secrets
        run: gitleaks git --no-banner --redact
      # Anchored here and aliased by the other two jobs, so this pin and its
      # inputs have one home. A plain alias, not a merge key (`<<:`): GitHub
      # supports the first and not the second.
      #
      # An alias must follow its anchor in document order, so this job has to
      # stay first in the `jobs:` map. Job order carries no meaning to Actions
      # and reordering reads as cosmetic, but moving `lint` below either other
      # job makes the alias unresolvable — a load error, which means no job
      # runs at all and the `actionlint` step above cannot report it.
      - &setup_uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ env.UV_PYTHON }}
          prune-cache: true # see the header note
      # One step per tool so a red step names the tool, but the commands are the
      # Makefile's, which is also what the pre-commit hook runs as `make lint`.
      - run: make lint-style
      - run: make lint-format
      - run: make lint-types
      - run: make lint-deps
      - run: make openapi-check

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15 # see the header note
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # Vestigial: the suite connects to a11y_health_test_<pid>, created
          # through the `postgres` maintenance database (tests/conftest.py).
          # The container needs some value; nothing connects to this one.
          POSTGRES_DB: a11y_health_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      # Names a database the service container never creates, so a fixture
      # that leaks to the non-test setting fails to connect here rather than
      # passing quietly against the test database — the leak
      # tests/cli/conftest.py's live_server binding exists to prevent (ADR
      # 0011). The invariant itself is no longer this value: it is
      # tests/_non_test_database.py, which refuses the connection in every run
      # including a developer's, where DATABASE_URL points at real data. This
      # stays as the second line of defense, catching a leak that reaches
      # Postgres by some route SQLAlchemy's events do not see.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/a11y_health_must_not_be_read
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/a11y_health_test
    steps:
      - uses: actions/checkout@v7
      - *setup_uv
      - run: uv run pytest

  migration-drift:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15 # see the header note
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: a11y_health
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/a11y_health
      # The roundtrip builds its own scratch database and reads the connection
      # from these, the variables psql and libpq already use. DATABASE_URL above
      # is for the drift step, which does want the service container's database.
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
      - *setup_uv
      - name: Migration roundtrip
        # The floor this downgrades to is DOWNGRADE_FLOOR in the Makefile, which
        # is also where the reason for its current value is written. Invoking
        # the target keeps it one value with one home, readable where the person
        # adding a migration works.
        run: make migrate-roundtrip
      - name: Migrate the service container's database
        # A step of its own because nothing else leaves this database at head.
        # The roundtrip above builds and drops its own scratch database and
        # exports DATABASE_URL for it in a child process, so the job's own
        # a11y_health stays empty; autogenerate below refuses to run against a
        # database behind head, and it refuses identically whether models have
        # drifted or not, so the drift check would detect nothing while looking
        # red on every run. Separate from the drift step so a failure here
        # cannot be read as drift.
        run: uv run alembic upgrade head
      - name: Check for model/migration drift
        # --rev-id fixes the generated path, so the check names the file it is
        # about instead of searching the directory for whatever is newest.
        run: |
          uv run alembic revision --autogenerate -m "drift_check" --rev-id driftcheck
          migration=migrations/versions/driftcheck_drift_check.py
          # --rev-id fixes the path, so alembic always writes this file and an
          # absent one means the path guess is wrong, not that the models are
          # in sync. Uncommenting file_template in alembic.ini is enough to
          # move it. Reported as an error: the old glob could read an absent
          # file as "nothing generated", this cannot, and a silent exit 0 here
          # would disable drift detection permanently with nothing going red.
          if [ ! -f "$migration" ]; then
            echo "::error::alembic wrote no file at the path this check derives (see file_template in alembic.ini); expected $migration"
            exit 1
          fi
          if grep -qE "^[[:space:]]*pass[[:space:]]*$" "$migration" && ! grep -qE "op\." "$migration"; then
            echo "Empty migration — models and migrations are in sync."
            exit 0
          fi
          echo "::error::Model/migration drift detected. Run 'alembic revision --autogenerate' locally."
          echo "--- Generated migration ---"
          cat "$migration"
          exit 1
