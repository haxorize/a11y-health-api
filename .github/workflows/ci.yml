name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  UV_PYTHON: "3.14"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans the whole history
      - name: Install gitleaks
        run: |
          curl -sSL -o "$RUNNER_TEMP/gitleaks.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Scan history for secrets
        run: gitleaks git --no-banner --redact
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ env.UV_PYTHON }}
          # setup-uv v9 flipped this default to false; set it explicitly so the
          # uv cache stays pruned regardless of what the action defaults to next.
          prune-cache: true
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - run: uv run deptry src migrations scripts
      - name: Check openapi.json is not stale
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code openapi.json

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Pinned to the major local dev runs (Homebrew PostgreSQL 15.x), so the
        # suite is measured against one server version everywhere. Bare major
        # tracks the newest 15.x patch.
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: a11y_health_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/a11y_health_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/a11y_health_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ env.UV_PYTHON }}
          # setup-uv v9 flipped this default to false; set it explicitly so the
          # uv cache stays pruned regardless of what the action defaults to next.
          prune-cache: true
      - run: uv run pytest

  migration-drift:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Pinned to the major local dev runs (Homebrew PostgreSQL 15.x), so the
        # suite is measured against one server version everywhere. Bare major
        # tracks the newest 15.x patch.
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: a11y_health
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/a11y_health
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ env.UV_PYTHON }}
          # setup-uv v9 flipped this default to false; set it explicitly so the
          # uv cache stays pruned regardless of what the action defaults to next.
          prune-cache: true
      - name: Migration roundtrip
        # Roundtrips to the newest irreversible migration, not base — its
        # downgrade() raises by design (b362121027a0, the one-time duplicate
        # rollup snapshot cleanup; #97). Bump the floor when a new irreversible
        # migration lands; everything above it must stay reversible.
        env:
          DOWNGRADE_FLOOR: "b362121027a0"
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade "$DOWNGRADE_FLOOR"
          uv run alembic upgrade head
      - name: Check for model/migration drift
        run: |
          uv run alembic revision --autogenerate -m "_drift_check" 2>&1
          MIGRATION=$(ls -t migrations/versions/*_drift_check.py 2>/dev/null | head -1)
          if [ -z "$MIGRATION" ]; then
            echo "No migration generated — models and migrations are in sync."
            exit 0
          fi
          if grep -q "pass" "$MIGRATION" && ! grep -qE "op\." "$MIGRATION"; then
            echo "Empty migration — models and migrations are in sync."
            exit 0
          fi
          echo "::error::Model/migration drift detected. Run 'alembic revision --autogenerate' locally."
          echo "--- Generated migration ---"
          cat "$MIGRATION"
          exit 1
