[project]
name = "a11y-health-api"
version = "0.1.0"
description = "Accessibility Health API"
readme = "README.md"
authors = [
    { name = "Nick Bourgeois", email = "nick@haxorize.com" }
]
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.31.0",
    "alembic>=1.18.5",
    "fastapi>=0.139.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "sqlalchemy[asyncio]>=2.0.51",
    "uvicorn[standard]>=0.51.0",
    "httpx>=0.28.1",
    "starlette>=1.3.1",
]

[project.scripts]
a11y = "a11y_health.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a11y_health"]

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.21",
    "ty>=0.0.59",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "ASYNC"]

[tool.ruff.lint.pycodestyle]
# Prose wraps narrower than code: comprehension lives in comments and docstrings
# here (ADR 0018), and a paragraph running to the 120 the formatter allows code
# is a paragraph nobody re-reads. W505 is the only mechanical check on it — the
# formatter never reflows prose, so drift is otherwise invisible until review.
max-doc-length = 80

[tool.ruff.lint.per-file-ignores]
# A shipped migration's body is history the suite runs, not code to edit; its
# comments are not worth churning a revision file for (cf. ADR 0038, which puts
# migrations outside the repo-wide import walk for the same reason).
"migrations/versions/*" = ["W505"]

[tool.ruff.lint.isort]
known-first-party = ["a11y_health"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.deptry]
# The scan covers every tree that imports the package (`make lint` names
# them), so first-party detection cannot key on one root.
known_first_party = ["a11y_health"]

[tool.deptry.per_rule_ignores]
# Loaded by name, never imported: asyncpg is SQLAlchemy's driver (the
# `postgresql+asyncpg://` URL), uvicorn is run as a command. alembic is
# imported by `migrations/env.py`, which the scan reads.
DEP002 = ["asyncpg", "uvicorn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
addopts = ["--strict-markers", "--strict-config"]
markers = [
    "slow: tests that take noticeably longer (opt out with -m 'not slow')",
    "integration: end-to-end tests that exercise multiple layers",
]

[tool.ty.environment]
python-version = "3.14"

[tool.coverage.run]
# The default ctrace core loses line tracking in coroutine frames resumed
# through the ASGI stack (endpoint returns and post-await service lines report
# as missed despite tests asserting their output). sys.monitoring measures
# them correctly on 3.13 and 3.14.
core = "sysmon"
